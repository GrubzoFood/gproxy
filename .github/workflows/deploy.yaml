name: Deploy
on:
  push:
    branches:
      - main
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - uses: hashicorp/setup-terraform@v3
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ap-south-2
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      # Build your Go binary (expects your root Makefile to produce ./gproxy)
      - name: Build
        run: make build

      # Apply infrastructure
      - name: Terraform Apply
        working-directory: ./_infra/terraform
        run: make init-apply-auto

      # Read the instance ID from Terraform outputs
      - name: Get Instance ID
        id: tf
        working-directory: ./_infra/terraform
        run: |
          echo "instance_id=$(terraform output -raw instance_id)" >> "$GITHUB_OUTPUT"

      # Upload the freshly built binary to S3
      - name: Upload artifact to S3
        run: |
          aws s3 cp ./gproxy s3://gproxy-tfstate/artifacts/gproxy \
            --only-show-errors

      # Deploy: pull the new binary from S3 on the instance, then restart
      - name: Deploy via SSM
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ steps.tf.outputs.instance_id }}" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=[
              "sudo aws s3 cp s3://gproxy-tfstate/artifacts/gproxy /opt/gproxy/gproxy.new",
              "sudo chmod +x /opt/gproxy/gproxy.new",
              "sudo mv /opt/gproxy/gproxy.new /opt/gproxy/gproxy",
              "sudo systemctl restart gproxy",
              "sudo systemctl status gproxy --no-pager"
            ]' \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ steps.tf.outputs.instance_id }}" || true

          echo "--- STDOUT ---"
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ steps.tf.outputs.instance_id }}" \
            --query "StandardOutputContent" \
            --output text

          echo "--- STDERR ---"
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ steps.tf.outputs.instance_id }}" \
            --query "StandardErrorContent" \
            --output text

          STATUS=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ steps.tf.outputs.instance_id }}" \
            --query "Status" \
            --output text)

          echo "Final status: $STATUS"

          if [ "$STATUS" != "Success" ]; then
            exit 1
          fi
